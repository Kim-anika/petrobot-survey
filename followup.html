<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>追加のご質問（4問）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── Tally 準拠のトークン ───────────────────────────────
   白地・細いグレー罫・キーバッジ付き選択肢・淡いティント選択。
   単一テーマで固定する：回答者ごとに配色が変わると提示刺激が
   変わるため、測定上こちらを優先する。                    */
:root{
  --bg:#fff; --ink:#1a1a1a; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --line-hover:#d1d5db; --tint:#f9fafb;
  --accent:#2563eb; --accent-bg:#eff6ff; --accent-line:#93b4fb;
  --btn:#18181b; --btn-ink:#fff;
  --warn:#92620a; --warn-bg:#fffbeb; --warn-line:#fcd34d; --danger:#b91c1c;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",
         "Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --barh:76px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.75;
  font-feature-settings:"palt" 1; -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
/* 進行バー（Tally：最上端の細いバー） */
#rail{position:fixed;inset:0 0 auto 0;height:2px;background:var(--line);z-index:32}
#rail>i{display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.4,0,.2,1)}
/* 上部バー：戻る と のこり。親指が届きにくい位置なので情報だけを置く */
#topbar{position:fixed;top:2px;left:0;right:0;height:46px;z-index:31;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
#topbar[hidden]{display:none!important}
#topbar .sp{max-width:640px;margin:0 auto;width:100%;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
#back{font:inherit;font-size:14px;color:var(--muted);background:none;border:none;
  padding:8px 10px 8px 0;margin-left:-2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#back[hidden]{visibility:hidden;display:inline-flex!important}
#remain{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 下部バー：主操作は必ず親指の届く位置に固定する */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:31;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line)}
#bottombar[hidden]{display:none!important}
#bottombar .sp{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#next{flex:1;justify-content:center;min-height:52px}
#bottombar .err{max-width:640px;margin:0 auto 10px;font-size:13.5px;line-height:1.6}
#bottombar .err:empty{display:none}
.hasbar{padding-top:48px}
.wrap{max-width:640px;margin:0 auto;
  padding-block:20px calc(var(--barh) + env(safe-area-inset-bottom) + 28px);
  padding-left:16px;padding-right:16px}
@media (min-width:520px){.wrap{padding-left:24px;padding-right:24px;padding-top:32px}}
.step{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}#rail>i{transition:none}}

/* ── 文字（Tally：太めのタイトル、灰色の説明） ── */
h1{font-size:clamp(27px,7vw,34px);font-weight:700;line-height:1.35;
  letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
h2{font-size:clamp(22px,5.6vw,27px);font-weight:700;line-height:1.4;
  letter-spacing:-.018em;margin:0 0 12px;text-wrap:balance}
/* Tally の質問ラベルは見出しではなく本文寄り。太らせすぎない */
.q{font-size:16.5px;font-weight:600;line-height:1.6;letter-spacing:-.005em;
  margin:0 0 4px;text-wrap:pretty}
.desc{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 4px}
.q + .opts,.desc + .opts{margin-top:14px}
.lede{font-size:16px;color:var(--muted);line-height:1.75;margin:0 0 28px}
.relink{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
/* 所属の明示。折りたたみの中にあると、開く前に離脱した人には
   「誰がやっている調査か」が伝わらない。最初の画面で必ず見える位置に置く */
.org{display:inline-block;font-size:13.5px;color:var(--muted);line-height:1.5;
  margin:0 0 14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--tint)}
.body-text{font-size:15px;line-height:1.75;margin:0 0 10px}
h3{font-size:15px;color:var(--ink);font-weight:600;margin:28px 0 6px;letter-spacing:-.005em}
.hint{font-size:13px;color:var(--faint);margin:10px 0 0}
.todo{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* ── 選択肢（Tally のマルチプルチョイス） ──────────────
   横並び7個は和文ラベルが潰れるため縦積み（README §9.2 原則5）。
   入力方式は7件法の選択のまま（§9.3）。
   第2部＝全ラベル／第3部＝両端のみ。行の形は完全に同一。      */
.opts{display:flex;flex-direction:column;gap:6px;margin:0}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;
  min-height:48px;padding:9px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;
  font:inherit;font-size:15px;color:var(--ink);text-align:left;cursor:pointer;
  transition:background .1s ease,border-color .1s ease;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){.opt:hover{background:var(--tint)}}
.key{
  flex:none;min-width:23px;height:23px;padding:0 4px;
  display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;
  background:var(--bg);color:var(--muted);
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
  box-shadow:0 1px 0 rgba(16,24,40,.03);
  transition:background .1s ease,border-color .1s ease,color .1s ease;
}
.opt .lab{min-width:0;overflow-wrap:anywhere}
.opt[aria-checked="true"]{background:var(--accent-bg);border-color:var(--accent)}
.opt[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 第3部の7件法：横一列 ────────────────────────────
   第3部は両端ラベルのみで中間にラベルが無いため、横並びでも
   和文が潰れない（第2部が横に出来ないのはラベル7個が理由）。
   ECR-GO 正本の提示形式（全く当てはまらない1－2－…－7 非常によく当てはまる）
   にも近い。aspect-ratio は flex の縮小を妨げるので使わないこと。 */
.scale7{display:flex;gap:5px;margin:0}
.scale7 button{
  flex:1 1 0;min-width:0;width:0;height:54px;padding:0;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .1s ease,border-color .1s ease,color .1s ease;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){.scale7 button:hover{background:var(--tint)}}
.scale7 button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.scale7 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 両端＋中央の3点。中央は7個のボタンの中心＝「4」の真下に来る。
   狭い画面では中央ラベルを次の行へ送り、文字が潰れないようにする。 */
.anchors{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:9px;
  font-size:11.5px;line-height:1.5;color:var(--muted)}
.anchors span{min-width:0;overflow-wrap:anywhere}
.anchors span:last-child{text-align:right}
.anchors .mid{text-align:center}
@media (max-width:379px){
  .anchors{grid-template-columns:1fr 1fr;row-gap:4px}
  .anchors .mid{order:3;grid-column:1 / -1;text-align:center}
}
.q + .scale7,.desc + .scale7{margin-top:16px}

/* まとめ表示：Tally は項目間に罫線を引かず、余白だけで区切る */
.qitem,.fitem{margin:0 0 42px}
.qitem:last-of-type,.fitem:last-of-type{margin-bottom:0}

/* ── 入力（Tally のショートアンサー） ── */
.inp{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%;
  transition:border-color .12s}
/* 年齢・時期は select にする。iOS はホイールピッカー、Android はスクロール一覧。
   font-size は 16px 未満にしないこと（iOS で自動ズームが起きる） */
.sel{
  font:inherit;font-size:16px;padding:11px 36px 11px 12px;
  border:1px solid var(--line);border-radius:6px;background-color:var(--bg);color:var(--ink);
  appearance:none;-webkit-appearance:none;cursor:pointer;max-width:100%;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:14px;
  transition:border-color .12s;
}
@media (hover:hover) and (pointer:fine){.sel:hover{border-color:var(--line-hover)}}
.sel:invalid,.sel.blank{color:var(--faint)}
@media (hover:hover) and (pointer:fine){.inp:hover{border-color:var(--line-hover)}}
.inp::placeholder{color:var(--faint)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sel{flex:1 1 0;min-width:0}
.w6{width:7em}.w5{width:5.6em}

/* ── 操作（Tally：ボタン＋「Enter ↵」の小さなヒント） ── */
.actions{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;padding:11px 22px;border-radius:6px;
  border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;
  transition:opacity .12s;-webkit-tap-highlight-color:transparent}
@media (hover:hover) and (pointer:fine){.btn:hover{opacity:.85}}
.btn:disabled{opacity:.3;cursor:not-allowed}
.enter{display:none;font-size:13px;color:var(--faint)}
@media (hover:hover) and (pointer:fine){.enter{display:inline}}
.enter b{font-weight:600;color:var(--muted)}
.keyhint{display:none;font-size:12.5px;color:var(--faint);margin-top:16px}
@media (hover:hover) and (pointer:fine){.keyhint{display:block}}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:34px;font-size:12.5px;color:var(--faint)}
.back{font:inherit;font-size:13px;color:var(--muted);background:none;border:none;
  padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}

.count{font-variant-numeric:tabular-nums}
.err{color:var(--danger);font-size:14.5px;margin-top:12px}
/* 未回答の項目を目印で示す（探させない） */
.qitem.missing,.fitem.missing{position:relative}
.qitem.missing::before,.fitem.missing::before{
  content:"";position:absolute;left:-13px;top:0;bottom:0;width:3px;
  border-radius:2px;background:var(--danger);opacity:.45}
.autosave{font-size:12.5px;color:var(--faint);margin:28px 0 0;line-height:1.7}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:500}
@media (hover:hover) and (pointer:fine){.btn.ghost:hover{background:var(--tint);opacity:1}}

/* ── その他 ── */
.consent-box{display:flex;gap:11px;align-items:flex-start;font-size:15px;cursor:pointer;
  padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:22px;
  transition:background .1s}
@media (hover:hover) and (pointer:fine){.consent-box:hover{background:var(--tint)}}
.consent-box input{width:19px;height:19px;margin:3px 0 0;flex:none;accent-color:var(--accent)}
.callout{background:var(--tint);border-radius:6px;
  padding:13px 15px;font-size:14px;line-height:1.7;margin:0 0 24px;color:var(--muted)}
.callout b{color:var(--ink)}
.quote{background:var(--tint);border-radius:6px;padding:14px 16px;margin:0 0 20px;
  font-size:14px;line-height:1.8;color:var(--muted)}
ul.plain{margin:0 0 14px;padding-left:1.15em;font-size:15px}
ul.plain li{margin-bottom:4px}
details{margin:14px 0 0;font-size:14px}
summary{cursor:pointer;color:var(--accent);padding:6px 0}
details .inner{border-left:2px solid var(--line);padding-left:14px;margin-top:8px;
  color:var(--muted);font-size:13.5px}
code{background:var(--tint);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:13px}
pre{background:var(--tint);border:1px solid var(--line);padding:13px;border-radius:7px;
  overflow:auto;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<!-- 修正14（2026-10-08）でロボット愛着の4項目を差し替えた。差し替え前に回答した人にだけ、
     新しい4項目を追加で尋ねるページ。?id=回答ID で開く。本回答と同じ文面・同じ7段階・同じ並び
     （C11・C8・C9・C10）で提示し、結果はスプレッドシートの followup シートに保存される。 -->
<div class="wrap"><div id="app"></div></div>
<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbwcQhXMCZtc0EKbMQfISX_lNmXQYjw_djDQLMsedmf7x4XvUfTv3JylmwqQx09LpobwPQ/exec";
var FORM_VERSION="2026-10-08-followup";
var LAB_P2=["全くあてはまらない","あてはまらない","あまりあてはまらない","どちらともいえない",
            "ややあてはまる","あてはまる","非常によくあてはまる"];
var ITEMS=[["C11","離れているときにも、このロボットのことをよく考える。"],
           ["C8","まったく同じ新品と交換できるとしても、今のこの個体のままがよい。"],
           ["C9","どんな条件を示されても、このロボットを手放すことは考えられない。"],
           ["C10","疲れているときでも、このロボットの世話はしたい。"]];
var ID=(new URLSearchParams(location.search).get("id")||"").toUpperCase();
var DONE_KEY="petrobot_followup_done_"+ID;
var ans={},log={},t0=Date.now(),startedAt=new Date().toISOString();

function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function app(h){document.getElementById("app").innerHTML='<div class="step">'+h+"</div>";}

function viewForm(){
  app("<h2>追加のご質問（4問）</h2>"+
    '<p class="lede">先日は調査にご協力いただき、ありがとうございました。'+
    "質問の一部を改訂したため、新しく加えた4問にだけ、追加でご回答をお願いいたします。1分ほどで終わります。</p>"+
    '<div class="callout">前回と同じロボット（<b>最もよく関わっている1体</b>）を思い浮かべて、'+
    "それぞれの文があなたの気持ちにどの程度あてはまるかを、7段階からお選びください。</div>"+
    ITEMS.map(function(it){
      var h="";
      for(var i=1;i<=7;i++){
        h+='<button type="button" class="opt" role="radio" aria-checked="'+(ans[it[0]]===i)+'" '+
           'data-code="'+it[0]+'" data-val="'+i+'"><span class="key">'+i+"</span>"+
           '<span class="lab">'+esc(LAB_P2[i-1])+"</span></button>";
      }
      return '<div class="qitem" data-code="'+it[0]+'"><p class="q">'+esc(it[1])+"</p>"+
             '<div class="opts" role="radiogroup" aria-label="'+it[0]+'">'+h+"</div></div>";
    }).join("")+
    '<div class="actions"><button type="button" class="btn" id="send" style="flex:1;min-height:52px">送信する</button></div>'+
    '<p class="err" id="err"></p>');
}

document.addEventListener("click",function(e){
  var b=e.target.closest(".opt");
  if(b){
    var c=b.dataset.code, v=+b.dataset.val, ms=Date.now()-t0;
    if(!log[c]) log[c]={t:ms,last:ms,chg:0};
    else if(ans[c]!==v){ log[c].last=ms; log[c].chg++; }
    ans[c]=v;
    document.querySelectorAll('.opt[data-code="'+c+'"]').forEach(function(x){
      x.setAttribute("aria-checked",String(+x.dataset.val===v));});
    var q=document.querySelector('.qitem[data-code="'+c+'"]'); if(q) q.classList.remove("missing");
    return;
  }
  if(e.target.id==="send") send();
});

function send(){
  var err=document.getElementById("err"), btn=document.getElementById("send");
  var miss=ITEMS.filter(function(it){return ans[it[0]]==null;});
  document.querySelectorAll(".qitem").forEach(function(q){
    q.classList.toggle("missing",ans[q.dataset.code]==null);});
  if(miss.length){ err.textContent="未回答の質問が"+miss.length+"問あります。"; return; }
  err.textContent=""; btn.disabled=true; btn.textContent="送信しています…";
  var payload={meta_type:"c_followup",meta_respId:ID,meta_formVersion:FORM_VERSION,
    meta_startedAt:startedAt,meta_finishedAt:new Date().toISOString(),
    meta_totalMs:Date.now()-t0,itemLog:JSON.stringify(log)};
  ITEMS.forEach(function(it){payload[it[0]]=ans[it[0]];});
  post(payload,3).then(function(){
    try{ localStorage.setItem(DONE_KEY,"1"); }catch(e){}
    viewThanks();
  },function(code){
    btn.disabled=false; btn.textContent="もう一度送信する";
    err.textContent = code==="unknown_id"
      ? "このリンクの回答IDが見つかりませんでした。お手数ですが、リンクを送った者にお知らせください。"
      : "送信できませんでした。通信状況をご確認のうえ、もう一度お試しください。";
  });
}
function post(payload,tries){
  return new Promise(function(resolve,reject){
    var n=0;
    (function go(){
      n++;
      var ctl=window.AbortController?new AbortController():null;
      var timer=setTimeout(function(){ if(ctl) ctl.abort(); },20000);
      /* text/plain で送るとプリフライトが発生しない（Apps Script は OPTIONS に応答しないため） */
      fetch(ENDPOINT,{method:"POST",redirect:"follow",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(timer); return r.json(); })
      .then(function(j){
        if(j&&j.ok) return resolve(j);
        if(j&&j.error==="unknown_id") return reject("unknown_id");   // 再送しても通らない
        throw new Error((j&&j.error)||"ng");
      })
      .catch(function(){ clearTimeout(timer); if(n<tries) setTimeout(go,1500); else reject("net"); });
    })();
  });
}
function viewThanks(){
  app("<h2>ご回答ありがとうございました</h2>"+
    '<p class="lede">追加のご質問への回答を受け付けました。このページは閉じていただいて構いません。</p>');
}

(function(){
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(ID)){
    app("<h2>このリンクは無効です</h2>"+
      '<p class="lede">お手数ですが、リンクを送った者にお知らせください。</p>'); return;
  }
  var done=null; try{ done=localStorage.getItem(DONE_KEY); }catch(e){}
  if(done){ viewThanks(); return; }
  viewForm();
})();
</script>
</body>
</html>
